server:
  port: 8080

spring:
  application:
    name: elmkusoma-core
  main:
    allow-bean-definition-overriding: true

  # Resource uploads: the media service accepts up to 50MB — core must not
  # reject the multipart before the server can read the real bytes.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:elmkusoma}?sslmode=require
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          batch_versioned_data: true

  flyway:
    enabled: true
    out-of-order: true
    baseline-on-migrate: true
    # History contains intentional checksum-0 "pre-existing migration" seed rows
    # (V48-V66) and V08 was edited after apply; validation must stay off (as it
    # was historically since 037ae99) or boot fails. Migrate still runs.
    # validate-on-migrate: false  -- NOW ENABLED after checksum repair
    validate-on-migrate: true
    placeholders:
      # V128: disable seeded demo accounts that ship with a published password hash.
      # Dev/test/e2e keep them (false); production profile overrides this to true.
      demoSeedDeactivate: "false"

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # SMTP delivery for OTP verification codes (OtpMailService). The dev default
  # targets a local MailHog/Mailpit-style sink on 1025; production overrides
  # with SPRING_MAIL_* (host/username/password) — delivery is best-effort and
  # an unreachable host never fails /v1/auth/send-code.
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          connectiontimeout: ${SPRING_MAIL_CONN_TIMEOUT:3000}
          timeout: ${SPRING_MAIL_TIMEOUT:3000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:3000}
          # Gmail on 587 authenticates only after STARTTLS is negotiated. Stated
          # explicitly rather than left to spring.mail.username implying it, so core
          # and elmkusoma-workers (which sets auth: true) behave identically.
          auth: true
          starttls.enable: ${SPRING_MAIL_STARTTLS:false}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000

livekit:
  server:
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:devsecret-devsecret-devsecret-dev01!}
  room:
    empty-timeout: 300
    max-participants: 10000
  ingress:
    enabled: ${LIVEKIT_INGRESS_ENABLED:false}
    whip-endpoint: ${LIVEKIT_WHIP_ENDPOINT:}
    rtmp-endpoint: ${LIVEKIT_RTMP_ENDPOINT:}
    srt-endpoint: ${LIVEKIT_SRT_ENDPOINT:}
  egress:
    enabled: ${LIVEKIT_EGRESS_ENABLED:false}
    output-bucket: ${LIVEKIT_EGRESS_BUCKET:}
    output-path: ${LIVEKIT_EGRESS_PATH:recordings/}
    # S3-compatible storage destination for recordings (LiveKit Cloud rejects file
    # outputs with no storage oneof: "invalid_argument: missing field: output").
    access-key: ${LIVEKIT_EGRESS_S3_ACCESS_KEY:}
    secret: ${LIVEKIT_EGRESS_S3_SECRET:}
    region: ${LIVEKIT_EGRESS_S3_REGION:}
    endpoint: ${LIVEKIT_EGRESS_S3_ENDPOINT:}

app:
  # Public base URL used to build emailed recovery/verification links
  # (/reset-password, /verify-email, /login). Previously nothing mapped this
  # property, so FRONTEND_URL in backend/.env was silently ignored and every
  # link fell back to http://localhost:3000. Both names are accepted:
  #   FRONTEND_URL     - what backend/.env documents (settable via the .env loader)
  #   APP_FRONTEND_URL - Spring's relaxed-binding form of app.frontend-url
  # No trailing slash. Validated at startup by FrontendUrlValidator, which
  # rejects a loopback host outright under the prod profile.
  frontend-url: ${FRONTEND_URL:${APP_FRONTEND_URL:http://localhost:3000}}
  recording-playback:
    # The recording byte path. GET /v1/replays/{id}/playback and
    # GET /v1/live-session/classes/{id}/recording/playback re-check role, institution,
    # class ownership and session participation on every request (including every Range
    # request a player makes while seeking), then proxy the bytes from the configured
    # egress endpoint. Clients are given these application URLs instead of the private
    # object-storage location.
    # Bounded resource consumption: no buffering (the stream is piped straight through),
    # redirects are never followed, and these two timeouts bound how long one request can
    # hold a request thread and an upstream connection.
    connect-timeout-ms: ${RECORDING_PLAYBACK_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${RECORDING_PLAYBACK_READ_TIMEOUT_MS:60000}
  security:
    # First-boot Platform Admin provisioning. Disabled by default: an existing
    # account is NEVER modified. When enabled, ADMIN_BOOTSTRAP_PASSWORD must be
    # supplied via environment; the password is used once at creation only.
    admin-bootstrap:
      enabled: ${ELM_BOOTSTRAP_ADMIN:false}

    # Networks (comma-separated address prefixes) whose X-Forwarded-For header may
    # be believed, e.g. the reverse proxy or load balancer in front of this app.
    #
    # Empty by default, and empty is the safe setting: X-Forwarded-For is chosen
    # by the caller, so trusting it lets one client present a fresh rate-limit
    # bucket per request. With nothing listed, every per-IP control (certificate
    # verification, login, auth, send-code, contact form) keys on the socket
    # address instead, which cannot be forged.
    #
    # Set this ONLY when the app is genuinely unreachable except through a proxy
    # you control. Listing a range that includes untrusted networks reintroduces
    # the spoofing this property exists to prevent.
    #   TRUSTED_PROXIES=10.0.0.,172.16.
    trusted-proxies: ${TRUSTED_PROXIES:}

# Payment provider webhook signature secret. Empty by default, which is
# deliberate and fail-closed: PaymentWebhookController rejects every webhook and
# logs that the secret is not configured. Mapped explicitly so that the same
# .env/env-var mechanism that feeds DB_PASSWORD also reaches it - the relaxed
# binding that resolves `payment.webhook.secret` only consults real environment
# variables, so a value written solely in backend/.env would otherwise be
# silently ignored. Setting it does not weaken verification: an empty value
# still rejects everything.
payment:
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET:}
  # Active outbound mobile-money provider adapter. "none" keeps the legacy
  # manual-verification flow exactly as before (no gateway calls, no behavior
  # change). Set ELMKUSOMA_PAYMENT_PROVIDER=stakaba only together with
  # STAKABA_ENABLED=true and a sandbox API key - StakabaConfigurationValidator
  # refuses to start the app if the provider is enabled without valid
  # sandbox credentials.
  provider: ${ELMKUSOMA_PAYMENT_PROVIDER:none}
  # Stakaba mobile-money gateway (https://docs.stakaba.com/).
  #
  # Sandbox and live share one base URL; the API key selects the environment.
  # This deployment is SANDBOX ONLY: a key beginning with sk_live_ is refused
  # at startup unless payment.stakaba.allow-live is explicitly set to true,
  # which is never done automatically and must not be set without a completed
  # go-live approval. api-key must come from the environment (backend/.env or
  # process env) - never from a committed file, the frontend, or a log line.
  stakaba:
    enabled: ${STAKABA_ENABLED:false}
    base-url: ${STAKABA_BASE_URL:https://api.stakaba.com}
    api-key: ${STAKABA_API_KEY:}
    connect-timeout-ms: ${STAKABA_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${STAKABA_READ_TIMEOUT_MS:15000}
    allow-live: ${STAKABA_ALLOW_LIVE:false}
    # The status lookup sends BOTH x-api-key and Authorization: Bearer, because
    # Stakaba's OpenAPI spec declares HTTPBearer for that endpoint while its
    # prose guides (and the collection endpoint in the same spec) use x-api-key.
    # Set to false to send only x-api-key once Stakaba confirms which applies.
    send-bearer-fallback: ${STAKABA_SEND_BEARER_FALLBACK:true}

services:
  media:
    url: ${MEDIA_SERVICE_URL:http://localhost:8083}
  realtime:
    url: ${REALTIME_SERVICE_URL:http://localhost:8081}
  workers:
    url: ${WORKERS_SERVICE_URL:http://localhost:8082}

# Course image storage.
#
# file.upload.dir is now declared here rather than left to a ${user.dir} default inside a
# controller. It used to resolve against the process working directory, which meant the bytes
# moved or vanished depending on where the process happened to be started from. Point it at a
# persistent volume in production; a multi-instance deployment should set
# COURSE_IMAGE_STORAGE=media-service instead so the objects live in MinIO and any instance can
# serve them.
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:${user.dir}/uploads}

course:
  image:
    # filesystem | media-service
    storage: ${COURSE_IMAGE_STORAGE:filesystem}

logging:
  level:
    tz.elmkusoma: INFO
    org.springframework.security: WARN
  pattern:
    # Every line carries the request's correlation id (see RequestCorrelationFilter),
    # so a payment or reconciliation line can be tied back to the call that produced it.
    level: "%5p [%X{correlationId:-}]"
